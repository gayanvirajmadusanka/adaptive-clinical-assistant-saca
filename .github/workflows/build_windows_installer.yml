name: Build Windows Installer

on:
  push:
    branches: [saca_v1]
    paths:
      - 'backend_release_windows/**'
      - 'windows_app/**'
      - 'backend/data/**'
      - 'backend/models/**'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-windows-${{ hashFiles('backend_release_windows/requirements_windows.txt') }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('windows_app/pom.xml') }}

      - name: Download JavaFX SDK
        shell: pwsh
        run: |
          $url  = "https://download2.gluonhq.com/openjfx/21.0.2/openjfx-21.0.2_windows-x64_bin-sdk.zip"
          $dest = "$env:RUNNER_TEMP\javafx.zip"
          Invoke-WebRequest -Uri $url -OutFile $dest
          Expand-Archive -Path $dest -DestinationPath "$env:RUNNER_TEMP\javafx"
          echo "JAVAFX_HOME=$env:RUNNER_TEMP\javafx\javafx-sdk-21.0.2" | Out-File -Append $env:GITHUB_ENV

      - name: Install Python dependencies
        run: pip install -r backend_release_windows/requirements_windows.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Build saca_server.exe (PyInstaller)
        run: pyinstaller backend_release_windows/saca_server.spec --clean --distpath backend_release_windows/dist

      - name: Build JavaFX app (Maven)
        working-directory: windows_app
        run: mvn clean package -q

      - name: Copy saca_server.exe into jpackage input
        shell: pwsh
        run: Copy-Item backend_release_windows\dist\saca_server.exe windows_app\target\lib\saca_server.exe

      - name: Run jpackage
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --name SACA `
            --app-version 1.0 `
            --vendor "SACA Team" `
            --description "SACA Adaptive Clinical Assistant" `
            --input windows_app\target\lib `
            --main-jar SACA-1.0-SNAPSHOT.jar `
            --main-class org.saca.MainApp `
            --module-path "$env:JAVAFX_HOME\lib" `
            --add-modules javafx.controls,javafx.fxml,javafx.media `
            --win-dir-chooser `
            --win-shortcut `
            --win-menu `
            --dest dist_installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SACA-Windows-Installer
          path: dist_installer\SACA-1.0.exe
          retention-days: 30
